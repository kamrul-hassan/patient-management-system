name: careflow

x-api: &api
  image: careflow-api:local
  build:
    context: ./apps/api
  user: "1654:1654"
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  networks: [database]

services:
  db:
    image: postgres:18-alpine@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5
    environment:
      POSTGRES_DB: careflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets: [postgres_password, migration_password, application_password]
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init-app.sh:/docker-entrypoint-initdb.d/10-init-app.sh:ro
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d careflow"]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  migrate:
    <<: *api
    command: [--migrate]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__AllowUnencryptedConnection: "true"
    secrets:
      - source: migration_connection
        target: ConnectionStrings__Careflow
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      # Only the isolated Docker database network uses plain transport.
      # External/managed databases must use certificate-verified TLS instead.
      Database__AllowUnencryptedConnection: "true"
      SeedDemoData: "false"
    secrets:
      - source: api_key
        target: ApiKey
      - source: application_connection
        target: ConnectionStrings__Careflow
    networks: [database, application]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    image: careflow-web:local
    build:
      context: ./apps/web
    user: node
    environment:
      API_URL: http://api:8080
      API_KEY_FILE: /run/secrets/api_key
      SESSION_SECRET_FILE: /run/secrets/session_secret
      STAFF_PASSWORD_FILE: /run/secrets/staff_password
      STAFF_EMAIL: ${STAFF_EMAIL:-admin@careflow.local}
      DEMO_MODE: "false"
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
    secrets: [api_key, session_secret, staff_password]
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /app/.next/cache:rw,nosuid,size=64m,uid=1000,gid=1000
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [application]
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

networks:
  database:
    internal: true
  application:

volumes:
  postgres_data:

secrets:
  postgres_password:
    file: ${CAREFLOW_SECRETS_DIR:-./.secrets}/postgres_password
  migration_password:
    file: ${CAREFLOW_SECRETS_DIR:-./.secrets}/migration_password
  application_password:
    file: ${CAREFLOW_SECRETS_DIR:-./.secrets}/application_password
  api_key:
    file: ${CAREFLOW_SECRETS_DIR:-./.secrets}/api_key
  session_secret:
    file: ${CAREFLOW_SECRETS_DIR:-./.secrets}/session_secret
  staff_password:
    file: ${CAREFLOW_SECRETS_DIR:-./.secrets}/staff_password
  migration_connection:
    file: ${CAREFLOW_SECRETS_DIR:-./.secrets}/migration_connection
  application_connection:
    file: ${CAREFLOW_SECRETS_DIR:-./.secrets}/application_connection
